[mod-setting-description]
spidertron-enhancements-spiderton-requires-fuel=Standard innebär att inställningen behålls som grundspelet eller en annan modd har angett den.
spidertron-enhancements-sound-pause=Genomsnittligt antal sekunder innan Spidertrons ljud spelas igen (ljudet varar i 19 s).

spidertron-enhancements-enter-entity=Anpassa kontrollerna på inställningsfliken [font=default-bold]Per spelare[/font].

spidertron-enhancements-enter-entity-base-game=Åsidosätter standardbeteendet för __CONTROL__toggle-driving__ när du kör en Spidertron nära ett fordon.\nBeror på inställningen ”Stig in i/lämna fordon från Spidertron” under [font=default-bold]Karta[/font].
spidertron-enhancements-enter-entity-custom=Beror på inställningen ”Stig in i/lämna fordon från Spidertron” under [font=default-bold]Karta[/font].
spidertron-enhancements-pipette-unconnected-remote=Beror på inställningen ”Spidertron-pipetten hämtar en tillfällig fjärrkontroll i stället för en ur förrådet” under [font=default-bold]Karta[/font].


