instruction-to-queue-spidertron-order=__1__ för att köa en förflyttningsorder.\n•   __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__ för att skicka Spidertron med vägsökning.\n•   __CONTROL__spidertron-enhancements-open-in-map__ för att visa Spidertron på kartan.\n•   __CONTROL__spidertron-enhancements-open-vehicle-inventory__ för att öppna Spidertrons förråd.

