[controls-description]
spidertron-enhancements-use-alt-spidertron-remote=Används med Spidertron-fjärrkontrollen för att ge den anslutna Spidertron en order med vägsökning.
spidertron-enhancements-enter-vehicles=Resultatet beror på om du är i eller nära ett fordon och kan anpassas i modinställningarna.\n[color=red]Använd inte samma tangent som grundspelets [font=default-bold]Stig in i/lämna fordon[/font] (__CONTROL__toggle-driving__)[/color].
spidertron-enhancements-spidertron-pipette=Hämtar en fjärrkontroll ur ditt förråd som är ansluten till den markerade Spidertron och placerar den vid pekaren.\nOm ingen Spidertron är markerad hämtas en fjärrkontroll till den Spidertron du kör.
spidertron-enhancements-spidertron-patrol-pipette=Fungerar bara när Spidertron Patrols är installerad.\nHämtar en patrullfjärrkontroll som är ansluten till den markerade Spidertron och placerar den vid pekaren.\nOm ingen Spidertron är markerad hämtas en patrullfjärrkontroll till den Spidertron du kör.
spidertron-enhancements-open-vehicle-inventory=Om du håller i en Spidertron-fjärrkontroll öppnas den anslutna Spidertrons förråd.\nAnnars öppnas förrådet i fordonet du kör.

