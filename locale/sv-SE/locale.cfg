[tips-and-tricks-item-description]
spidertron-enhancements=En översikt över de viktigaste funktionerna som [font=default-bold]Spidertron Enhancements[/font] lägger till. Se modinställningarna eller sidan på moddportalen för en fullständig funktionslista.
spidertron-enhancements-enter-train=Tryck på __CONTROL__toggle-driving__ och/eller __CONTROL__spidertron-enhancements-enter-vehicles__ (beroende på inställningarna) nära ett fordon för att stiga in i det.
spidertron-enhancements-quick-toggle=__ALT_CONTROL__1__spidertron-enhancements-enter-vehicles__ för att snabbväxla den Spidertron du kör.
spidertron-enhancements-pathfinder=__ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__ med [item=spidertron-remote] för att använda vägsökning och automatiskt ta vägen runt vatten.
spidertron-enhancements-remote-pipette=__ALT_CONTROL__1__spidertron-enhancements-spidertron-pipette__ medan pekaren hålls över en Spidertron för att välja en [item=spidertron-remote] som är ansluten till den.


